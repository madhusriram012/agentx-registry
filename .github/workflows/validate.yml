name: validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate (full + immutability + ownership on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main
            python scripts/validate.py . --base main --pr-author "${{ github.event.pull_request.user.login }}"
          else
            python scripts/validate.py .
          fi
